name: validate

on:
  pull_request:
    branches: [main, "release/**"]
  push:
    branches: [main, "release/**"]

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 权威规则在同步引擎的 SkillCatalogValidator（纯函数）。
      # 独立校验 CLI 尚未实施，这里只做不依赖引擎的结构性检查；
      # CLI 就绪后应整体替换为「与 SyncEngine 同源」的校验器，避免两套规则漂移。
      - name: Structural checks
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          # 根文件
          for f in README.md LICENSE .gitattributes skillshub.json catalog.json; do
            [ -f "$f" ] || fail "缺少根文件 $f"
          done

          # 文本文件 UTF-8 无 BOM
          while IFS= read -r f; do
            head -c 3 "$f" | grep -q $'\xEF\xBB\xBF' && fail "$f 含 UTF-8 BOM"
          done < <(find . -type f \( -name '*.md' -o -name '*.json' -o -name '*.yml' -o -name '*.svg' \) -not -path './.git/*')

          # LF 换行
          if grep -rlI $'\r' --include='*.md' --include='*.json' --include='*.yml' --include='*.svg' . 2>/dev/null | grep -v '^\./\.git/' | grep -q .; then
            fail "存在 CRLF 换行文件"
          fi

          # skillshub.json 可解析
          python3 -c "import json,sys; json.load(open('skillshub.json'))" || fail "skillshub.json 非法 JSON"

          # catalog 与物理两层布局的结构约定（完整语义仍以 SyncEngine 校验器为准）
          python3 - <<'PY'
          import json, pathlib, re, sys
          root = pathlib.Path('.')
          catalog = json.loads((root / 'catalog.json').read_text(encoding='utf-8'))
          seen = set()
          def key_ok(key):
              return isinstance(key, str) and len(key) <= 64 and re.fullmatch(r'[A-Za-z_][A-Za-z0-9_]*', key)
          for category in catalog.get('categories', []):
              category_key = category.get('key')
              if not key_ok(category_key): sys.exit(f'非法分类 Key: {category_key!r}')
              if len(category.get('text') or '') > 128: sys.exit('分类 text 超过128字符')
              for item in category.get('skills', []):
                  key = item.get('key')
                  if not key_ok(key): sys.exit(f'非法技能 Key: {key!r}')
                  if key in seen: sys.exit(f'catalog 重复 Key: {key}')
                  seen.add(key)
                  if len(item.get('text') or '') > 128: sys.exit(f'{key} 的 text 超过128字符')
                  if not (root / 'skills' / category_key / key / 'skill.json').is_file():
                      sys.exit(f'catalog 引用的路径不存在: skills/{category_key}/{key}/skill.json')
          for category in (root / 'skills').iterdir():
              if not category.is_dir(): continue
              if not key_ok(category.name): sys.exit(f'非法分类目录: {category.name}')
              if (category / 'skill.json').exists(): sys.exit('技能必须位于 skills/<category>/<key>/ 两层目录')
          PY

          # 逐技能目录
          if [ -d skills ]; then
            for dir in skills/*/*/; do
              [ -d "$dir" ] || continue
              key=$(basename "$dir")

              echo "$key" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*$' || fail "Key '$key' 不符合 ^[A-Za-z_][A-Za-z0-9_]*\$"
              [ "${#key}" -le 64 ] || fail "Key '$key' 超过 64 字符"

              [ -f "$dir/skill.json" ] || fail "$key 缺少 skill.json"
              [ -f "$dir/SKILL.md" ]    || fail "$key 缺少 SKILL.md"

              python3 - "$dir" "$key" <<'PY'
          import json, sys, re
          directory, key = sys.argv[1], sys.argv[2]
          manifest = json.load(open(directory + "skill.json"))
          if manifest.get("key") != key:
              sys.exit(f"skill.json.key ({manifest.get('key')!r}) 必须等于目录名 ({key!r})")
          PY

              # 安全条款：禁隐藏文件 / 可执行文件 / symlink
              find "$dir" \( -name '.*' -o -type l \) | grep -q . && fail "$key 含隐藏文件或 symlink"
              find "$dir" -type f \( -name '*.sh' -o -name '*.ps1' -o -name '*.exe' \
                -o -name '*.bat' -o -name '*.cmd' -o -name '*.dll' -o -name '*.so' -o -name '*.dylib' \) \
                | grep -q . && fail "$key 含可执行载荷"

              # 资产扩展名与总量
              if [ -d "$dir/assets" ]; then
                find "$dir/assets" -type f ! \( -name '*.webp' -o -name '*.png' -o -name '*.svg' \) \
                  | grep -q . && fail "$key/assets 含不允许的扩展名"
                total=$(find "$dir/assets" -type f -exec stat -c%s {} + 2>/dev/null | awk '{s+=$1} END {print s+0}')
                [ "$total" -le 2097152 ] || fail "$key/assets 超过 2MB"
              fi
            done
          fi

          echo "结构性检查通过"
